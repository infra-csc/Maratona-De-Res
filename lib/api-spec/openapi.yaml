openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Maratona de Resultados API
tags:
  - name: health
  - name: auth
  - name: users
  - name: areas
  - name: employees
  - name: events
  - name: criteria
  - name: evaluations
  - name: calibrations
  - name: absences
  - name: rules
  - name: platoon-rules
  - name: dashboard
  - name: analytics
  - name: results
  - name: ranking
  - name: audit
  - name: integration
  - name: exports
  - name: Storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: OK

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change own password (used for forced first-login password change)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed, fresh session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/impersonate:
    post:
      operationId: impersonate
      tags: [auth]
      summary: Admin dev mode — get a session token to view as another user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpersonateInput"
      responses:
        "200":
          description: Impersonation session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/by-area/{areaId}:
    get:
      operationId: getUsersByArea
      tags: [users]
      summary: List active users in a given area (for redirect dropdowns)
      parameters:
        - name: areaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/collaborators-without-access:
    get:
      operationId: getCollaboratorsWithoutAccess
      tags: [users]
      summary: Preview of active colaboradores that still have no login (used before bulk-generating access)
      parameters:
        - name: employmentType
          in: query
          required: false
          schema:
            type: string
            enum: [casa, freela]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollaboratorsWithoutAccessPreview"

  /users/bulk-generate-collaborator-access:
    post:
      operationId: bulkGenerateCollaboratorAccess
      tags: [users]
      summary: Bulk-generate CPF-based login credentials for active colaboradores without an account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkGenerateAccessInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkGenerateAccessResult"

  /users/{id}/merge:
    post:
      operationId: mergeUser
      tags: [users]
      summary: Merge duplicate evaluator user accounts into a canonical one
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeUserInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeUserResult"

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset user password
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: OK

  /areas:
    get:
      operationId: getAreas
      tags: [areas]
      summary: List areas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
    post:
      operationId: createArea
      tags: [areas]
      summary: Create area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"

  /areas/{id}:
    patch:
      operationId: updateArea
      tags: [areas]
      summary: Update area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"

  /areas/{id}/conformity-routing:
    put:
      operationId: setAreaConformityRouting
      tags: [areas]
      summary: Set the default Matriz de Conformidade evaluator for an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaConformityRoutingInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaConformityRouting"

  /conformity-routing:
    get:
      operationId: getConformityRouting
      tags: [areas]
      summary: List the default Matriz de Conformidade evaluator configured per area
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaConformityRoutingListItem"

  /employees:
    get:
      operationId: getEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeCreateResponse"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}/merge:
    post:
      operationId: mergeEmployee
      tags: [employees]
      summary: Merge duplicate employees into a canonical record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeEmployeeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeEmployeeResult"

  /employees/{id}/history:
    get:
      operationId: getEmployeeHistory
      tags: [employees]
      summary: Get employee quarterly history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuarterlyResult"

  /events:
    get:
      operationId: getEvents
      tags: [events]
      summary: List events
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events/{id}/historical-result:
    patch:
      operationId: updateHistoricalResult
      tags: [events]
      summary: Directly edit the imported score/notes of a historical event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalResultUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResultsConfirmationResponse"

  /events/{id}/merge:
    post:
      operationId: mergeEvent
      tags: [events]
      summary: Merge a duplicate event into this one
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeEventInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeEventResult"

  /events/{id}/close:
    post:
      operationId: closeEvent
      tags: [events]
      summary: Close event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForceCloseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}/reopen:
    post:
      operationId: reopenEvent
      tags: [events]
      summary: Reopen event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}/confirm-results:
    post:
      operationId: confirmEventResults
      tags: [events]
      summary: Confirm event results (only after this does the event count toward employees' score/eligibility)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResultsConfirmationResponse"

  /events/{id}/unconfirm-results:
    post:
      operationId: unconfirmEventResults
      tags: [events]
      summary: Revert event results confirmation (event stops counting toward employees' score/eligibility)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResultsConfirmationResponse"

  /events/{id}/result:
    get:
      operationId: getEventResult
      tags: [results]
      summary: Get event results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventTeamResult"

  /events/{id}/feedback:
    get:
      operationId: getEventFeedback
      tags: [results]
      summary: Get event team feedback (gated on completion; no evaluator names)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFeedback"

  /events/{id}/feedback/release:
    post:
      operationId: releaseEventFeedback
      tags: [results]
      summary: Release event feedback to participants (after all evaluations done)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFeedback"

  /events/{id}/criteria/{criterionId}/publish-partial:
    post:
      operationId: publishCriterionPartialFeedback
      tags: [results]
      summary: Publish a partial (in-progress) feedback snapshot for a single criterion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: criterionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFeedback"

  /events/{id}/criteria/{criterionId}/publish-final:
    post:
      operationId: publishCriterionFinalFeedback
      tags: [results]
      summary: Mark a single criterion as "Final" — employee sees it without the partial-draft warning. No edit lock; recalibrations update the score automatically.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: criterionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  criterionId:
                    type: integer
                  finalPublishedAt:
                    type: ["string", "null"]
                  partialPublishedAt:
                    type: ["string", "null"]

  /events/{id}/criteria/publish-partial-all:
    post:
      operationId: publishAllCriteriaPartialFeedback
      tags: [results]
      summary: Mark ALL active criteria in an event as "Partial" at once
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  published:
                    type: integer
                  partialPublishedAt:
                    type: string

  /events/{id}/criteria/publish-final-all:
    post:
      operationId: publishAllCriteriaFinalFeedback
      tags: [results]
      summary: Mark ALL active criteria in an event as "Final" at once
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  published:
                    type: integer
                  finalPublishedAt:
                    type: string

  /events/{id}/participants:
    get:
      operationId: getEventParticipants
      tags: [events]
      summary: List event participants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventParticipant"
    post:
      operationId: addEventParticipant
      tags: [events]
      summary: Add participant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventParticipantInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventParticipant"

  /events/{id}/participants/{participantId}:
    delete:
      operationId: removeEventParticipant
      tags: [events]
      summary: Remove participant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
    patch:
      operationId: updateEventParticipant
      tags: [events]
      summary: Update participant (e.g. mark as confirmed/inactive)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventParticipantUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventParticipant"

  /events/{id}/conformity-evaluator:
    post:
      operationId: setConformityEvaluator
      tags: [events]
      summary: Assign (or unassign) the conformity evaluator for an event (Grupo 2 - Cenografia)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConformityEvaluatorInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
    patch:
      operationId: redirectConformityEvaluator
      tags: [events]
      summary: Redirect (delegate) the Cenografia conformity evaluator to another user in area 13
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConformityEvaluatorRedirectInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"

  /events/{id}/conformity-evaluator-ferramentas:
    post:
      operationId: setConformityEvaluatorFerramentas
      tags: [events]
      summary: Assign (or unassign) the equipment evaluator for an event (Grupo 1 - Ferramentas e Case)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConformityEvaluatorInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
    patch:
      operationId: redirectConformityEvaluatorFerramentas
      tags: [events]
      summary: Redirect (delegate) the Ferramentas e Case evaluator to another user in area 16
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConformityEvaluatorRedirectInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"

  /events/{id}/conformity:
    get:
      operationId: getEventConformity
      tags: [events]
      summary: Get event conformity matrix
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EventConformity"
                  - type: "null"
    post:
      operationId: setEventConformity
      tags: [events]
      summary: Create or update event conformity matrix
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventConformityInput"
      responses:
        "200":
