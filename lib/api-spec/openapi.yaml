          type: array
          items:
            $ref: "#/components/schemas/HistoricalImportOverlapCandidate"
          description: >-
            Apenas quando action=create. Eventos já cadastrados cujo período cobre esta data —
            possíveis duplicatas com nome diferente. Não bloqueiam a importação; o admin pode
            escolher vincular a um deles via linkOverrides em vez de criar um evento novo.

    HistoricalImportResult:
      type: object
      required: [success, dryRun, errors, totalRows, matched, unmatched, ambiguous, events]
      properties:
        success:
          type: boolean
        dryRun:
          type: boolean
        errors:
          type: array
          items:
            type: string
        totalRows:
          type: integer
        matched:
          type: integer
        unmatched:
          type: array
          items:
            type: string
        ambiguous:
          type: array
          items:
            type: string
        cycleFallback:
          type: array
          items:
            type: string
          description: Eventos cuja data não cai em nenhum ciclo cadastrado e que serão vinculados ao ciclo atual automaticamente.
        events:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalImportEventPlan"
        employeesToCreate:
          type: array
          items:
            type: string
          description: Nomes de colaboradores não cadastrados que serão criados automaticamente ao confirmar.
        employeesCreated:
          type: integer
          description: Quantidade de colaboradores criados automaticamente (apenas no commit).
        eventsCreated:
          type: integer
        eventsUpdated:
          type: integer
        participantsLinked:
          type: integer
        warnings:
          type: array
          items:
            type: string

    SurveyImportInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: array
            items: {}
          description: >-
            Linhas da planilha (sem cabeçalho), cada uma um array de 29
            células na ordem original das colunas do xlsx.
        dryRun:
          type: boolean
          description: Defaults to true. Set to false to commit (only applied when there are zero errors and every group is linked).
        linkOverrides:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Mapa de groupKey (de SurveyGroupPlan) para o id do evento já
            cadastrado ao qual esse grupo da planilha deve ser vinculado.
            Use -1 para IGNORAR o grupo (linhas não são importadas).
            Obrigatório para todos os grupos antes do commit — este import
            nunca cria eventos novos.

    SurveyEventSuggestion:
      type: object
      required: [id, name, startDate, isHistorical]
      properties:
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
        isHistorical:
          type: boolean

    SurveyLinkedEventSummary:
      type: object
      required: [id, name, startDate, isHistorical, status, cycleId]
      properties:
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
        isHistorical:
          type: boolean
        status:
          type: string
        cycleId:
          type: integer

    SurveyGroupPlan:
      type: object
      required: [groupKey, eventLabel, rowCount, distinctEvaluators, suggestions, resolved]
      properties:
        groupKey:
          type: string
          description: Identificador estável do grupo (texto do evento normalizado), usado em linkOverrides.
        eventLabel:
          type: string
          description: Texto original da coluna Evento+cidade+data da planilha.
        rowCount:
          type: integer
        distinctEvaluators:
          type: integer
        linkedEventId:
          type: integer
        linkedEvent:
          $ref: "#/components/schemas/SurveyLinkedEventSummary"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SurveyEventSuggestion"
          description: Eventos já cadastrados sugeridos por semelhança de nome/cidade, para ajudar a escolher o vínculo.
        resolved:
          type: boolean
          description: true quando um linkOverride válido (evento ou -1/ignorar) foi informado para este grupo.
        ignored:
          type: boolean
          description: true quando o grupo foi marcado para ser ignorado (linkOverride -1).

    SurveyCatalogChanges:
      type: object
      required: [toDeactivate, toCreateOrActivate]
      properties:
        toDeactivate:
          type: array
          items:
            type: string
          description: Nomes de critérios que serão desativados (active=false) no commit.
        toCreateOrActivate:
          type: array
          items:
            type: string
          description: Nomes de critérios que serão criados ou reativados no commit.

    SurveyCreatedAvaliador:
      type: object
      required: [name, email, tempPassword]
      properties:
        name:
          type: string
        email:
          type: string
        tempPassword:
          type: string
          description: Senha provisória em texto puro, retornada apenas uma vez neste response para o RH distribuir ao avaliador.

    SurveyImportResult:
      type: object
      required: [success, dryRun, errors, totalRows, groups, unresolvedGroups, avaliadoresToCreate, catalogChanges, warnings]
      properties:
        success:
          type: boolean
        dryRun:
          type: boolean
        errors:
          type: array
          items:
            type: string
        totalRows:
          type: integer
        groups:
          type: array
          items:
            $ref: "#/components/schemas/SurveyGroupPlan"
        unresolvedGroups:
          type: array
          items:
            type: string
          description: groupKeys ainda sem vínculo — precisam de linkOverrides antes do commit.
        avaliadoresToCreate:
          type: array
          items:
            type: string
          description: Nomes de avaliadores que serão criados como usuários novos ao confirmar.
        catalogChanges:
          $ref: "#/components/schemas/SurveyCatalogChanges"
        warnings:
          type: array
          items:
            type: string
        duplicateRowsIgnored:
          type: integer
          description: Respostas repetidas do mesmo avaliador para o mesmo evento — só a mais recente é importada.
        evaluationsAlreadyInApp:
          type: integer
          description: Notas da planilha que já existem no app (mesmo evento, quesito e avaliador) e serão puladas.
        usersCreated:
          type: integer
        evaluationsCreated:
          type: integer
        evaluationsSkipped:
          type: integer
          description: Notas puladas no commit por já existirem no app (mesmo evento, quesito e avaliador).
        assignmentsCreated:
          type: integer
        conformitiesUpserted:
          type: integer
        eventsUpdated:
          type: integer
        createdAvaliadores:
          type: array
          items:
            $ref: "#/components/schemas/SurveyCreatedAvaliador"
          description: Apenas no commit — credenciais provisórias dos avaliadores criados.

    DedupeEvaluationsInput:
      type: object
      properties:
        dryRun:
          type: boolean
          description: Quando true (padrão), apenas conta as duplicatas sem apagar nada.

    DedupeEvaluationsResult:
      type: object
      required: [success, dryRun, duplicatesFound, groupsAffected, eventsAffected, duplicatesRemoved, warnings]
      properties:
        success:
          type: boolean
        dryRun:
          type: boolean
        duplicatesFound:
          type: integer
          description: Cópias exatas encontradas além da primeira gravada.
        groupsAffected:
          type: integer
          description: Combinações (evento, quesito, avaliador, conteúdo) com duplicatas.
        eventsAffected:
          type: integer
        duplicatesRemoved:
          type: integer
        warnings:
          type: array
          items:
            type: string

    CsvExport:
      type: object
      required: [filename, data]
      properties:
        filename:
          type: string
        data:
          type: string

