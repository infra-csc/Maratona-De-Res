          deprecated: true
          type: ["array", "null"]
          items:
            type: string
          description: >-
            LEGADO — a validação de diárias foi removida do app. Mantido
            apenas como leitura de dados históricos; não é mais escrito.
            A presença é controlada exclusivamente pelo campo `confirmed`.
        actualDiariaCount:
          deprecated: true
          type: ["integer", "null"]
          description: LEGADO — ver actualDiariaDates. Não é mais escrito.
        diariaQuickConfirmed:
          deprecated: true
          type: ["boolean", "null"]
          description: LEGADO — o modo rápido de confirmação não existe mais.
        diariaQuickConfirmedAt:
          deprecated: true
          type: ["string", "null"]
          description: LEGADO — timestamp histórico da confirmação rápida.
        comment:
          type: ["string", "null"]
          description: >-
            Comentário livre sobre o colaborador nesse evento (ex.:
            justificativa de inatividade).
        countsForScore:
          type: boolean
          description: >-
            Se false, a participação é apenas histórica/informativa (freela
            ou função "Sup Ceno *") e nunca entra na nota nem na elegibilidade.

