components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `audio/webm`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: E-mail corporativo (admin/rh/diretoria/avaliador) or CPF (colaboradores)
        password:
          type: string

    ChangePasswordInput:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
        confirmPassword:
          type: string
        currentPassword:
          type: string
          description: Obrigatória fora do fluxo de troca obrigatória (primeiro acesso).

    ImpersonateInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    UserSummary:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string

    User:
      type: object
      required: [id, name, role, active]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        cpfLogin:
          type: ["string", "null"]
        role:
          type: string
        areaId:
          type: ["integer", "null"]
        areaName:
          type: ["string", "null"]
        employeeId:
          type: ["integer", "null"]
        employeeName:
          type: ["string", "null"]
        active:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
        impersonatorId:
          type: integer
          description: Só no "Modo Dev" (sessão de impersonação) — id do admin real.
        impersonatorName:
          type: ["string", "null"]
          description: Só no "Modo Dev" — nome do admin real.

    UserInput:
      type: object
      required: [name, email, role, password]
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
        areaId:
          type: ["integer", "null"]
        employeeId:
          type: ["integer", "null"]
        password:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
        areaId:
          type: ["integer", "null"]
        employeeId:
          type: ["integer", "null"]
        active:
          type: boolean

    CollaboratorsWithoutAccessPreview:
      type: object
      required: [eligibleCount, missingCpfCount, missingCpf]
      properties:
        eligibleCount:
          type: integer
        missingCpfCount:
          type: integer
        missingCpf:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: integer
              name:
                type: string

    BulkGenerateAccessInput:
      type: object
      properties:
        employmentType:
          type: string
          enum: [casa, freela]
        dryRun:
          type: boolean

    GeneratedCredential:
      type: object
      required: [employeeId, name, cpfLogin, password]
      properties:
        employeeId:
          type: integer
        name:
          type: string
        cpfLogin:
          type: string
        password:
          type: string

    BulkGenerateAccessResult:
      type: object
      required: [dryRun, createdCount, created, missingCpf, conflicts]
      properties:
        dryRun:
          type: boolean
        createdCount:
          type: integer
        created:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedCredential"
        missingCpf:
          type: array
          items:
            type: object
            required: [employeeId, name]
            properties:
              employeeId:
                type: integer
              name:
                type: string
        conflicts:
          type: array
          items:
            type: object
            required: [employeeId, name]
            properties:
              employeeId:
                type: integer
              name:
                type: string

    ResetPasswordInput:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string

    Area:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        active:
          type: boolean

    AreaInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    AreaUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        active:
          type: boolean

    AreaConformityRoutingInput:
      type: object
      properties:
        defaultEvaluatorId:
          type: ["integer", "null"]

    AreaConformityRouting:
      type: object
      required: [id, areaId, defaultEvaluatorId]
      properties:
        id:
          type: integer
        areaId:
          type: integer
        defaultEvaluatorId:
          type: ["integer", "null"]

    AreaConformityRoutingListItem:
      type: object
      required: [id, areaId, areaName, defaultEvaluatorId, defaultEvaluatorName]
      properties:
        id:
          type: integer
        areaId:
          type: integer
        areaName:
          type: ["string", "null"]
        defaultEvaluatorId:
          type: ["integer", "null"]
        defaultEvaluatorName:
          type: ["string", "null"]

    Employee:
      type: object
      required: [id, name, department, functionName, active]
      properties:
        id:
          type: integer
        externalId:
          type: ["string", "null"]
        name:
          type: string
        document:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        department:
          type: string
        functionName:
          type: string
        employmentType:
          type: string
          enum: [casa, freela]
        active:
          type: boolean
        eligibleForBonus:
          type: boolean
        eligibilityStatus:
          type: ["string", "null"]
        eligibilityReason:
          type: ["string", "null"]
        sourceType:
          type: string
        createdAt:
          type: string

    EmployeeCreateResponse:
      allOf:
        - $ref: "#/components/schemas/Employee"
        - type: object
          properties:
            generatedAccess:
              type: ["object", "null"]
              properties:
                cpfLogin:
                  type: string
                password:
                  type: string

    EmployeeInput:
      type: object
      required: [name, department, functionName]
      properties:
        name:
          type: string
        document:
          type: string
        email:
          type: string
        phone:
          type: string
        department:
          type: string
        functionName:
          type: string
        employmentType:
          type: string
          enum: [casa, freela]

    EmployeeUpdate:
      type: object
      properties:
        name:
          type: string
        document:
          type: string
        email:
          type: string
        phone:
          type: string
        department:
          type: string
        functionName:
          type: string
        employmentType:
          type: string
          enum: [casa, freela]
        active:
          type: boolean
        eligibleForBonus:
          type: boolean
        eligibilityStatus:
          type: string
        eligibilityReason:
          type: string

    Event:
      type: object
      required: [id, name, startDate, endDate, cycleId, status]
      properties:
        id:
          type: integer
        externalId:
          type: ["string", "null"]
        name:
          type: string
        clientName:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        startDate:
          type: string
        endDate:
          type: string
        cycleId:
          type: integer
        cycleName:
          type: string
        status:
          type: string
        eventWeight:
          type: number
        forcedClosed:
          type: boolean
        participantCount:
          type: integer
        evaluationProgress:
          type: number
        totalCriteria:
          type: integer
        submittedCount:
          type: integer
        evaluatedCriteria:
          type: integer
          description: Nº de critérios ativos já avaliados (ou calibrados) neste evento.
        totalEvaluatorSlots:
          type: integer
          description: Soma de avaliadores designados por critério ativo (pai + eventScoped). Denominador correto para barra de avaliações.
        submittedEvaluatorCount:
          type: integer
          description: Soma de avaliadores que já submeteram por critério ativo. Numerador para barra de avaliações.
        calibratedCriteriaCount:
          type: integer
          description: Nº de critérios ativos com calibração salva (score preenchido, independente de publicação de feedback).
        finalCalibratedCriteria:
          type: integer
          description: Nº de critérios ativos com calibração final publicada.
        partialPublishedCount:
          type: integer
          description: Nº de critérios ativos com pelo menos uma publicação parcial.
        averageScore:
          type: ["number", "null"]
        teamScore:
          type: ["number", "null"]
        hasCalibration:
          type: boolean
        fullyCalibrated:
          type: boolean
        criteriaConfirmed:
          type: boolean
        feedbackReleased:
          type: boolean
        feedbackReleasedAt:
          type: ["string", "null"]
