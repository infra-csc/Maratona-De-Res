name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Portão que faltava: o build de produção só sai se typecheck e testes passarem.
      - name: Typecheck (libs + api + web)
        run: pnpm run typecheck

      # Unitários (regras de cálculo) + testes de rota: a API real (src/app.ts,
      # sem build) contra Postgres em WebAssembly (PGlite, devDependency da raiz)
      # com todas as migrações aplicadas. Nada de serviço externo no job.
      - name: Testes (unitários + rotas com Postgres em WASM)
        run: pnpm run test

      - name: Contrato da API
        run: |
          pnpm run check:api-contract

      - name: Contrato OpenAPI em dia com o cliente gerado
        run: |
          pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated || {
            echo "::error::openapi.yaml mudou sem regenerar o cliente. Rode: pnpm --filter @workspace/api-spec run codegen"; exit 1; }

      - name: Build de produção (api + web)
        run: pnpm --filter @workspace/api-server --filter @workspace/maratona run build
        env:
          PORT: "8080"
          BASE_PATH: "/"
          NODE_ENV: production

  # E2E de navegador (Playwright): login → evento → avaliação → calibração →
  # confirmação → bônus em Resultados. Banco em WASM (PGlite), API e front a
  # partir do build de produção — tudo sobe no global-setup (e2e/), sem serviço
  # externo. Roda em paralelo ao job "check".
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar o Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (api + web)
        run: pnpm --filter @workspace/api-server --filter @workspace/maratona run build
        env:
          PORT: "5191"
          BASE_PATH: "/"
          NODE_ENV: production

      - name: E2E (Playwright)
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:e2e 2>&1 | tee e2e-output.log

      # Os logs do Actions pedem login mesmo em repositório público; as
      # anotações não. Em falha, o fim da saída do teste e do log da API vira
      # anotação, legível por quem acompanha o CI pela API ou pela página.
      - name: Resumo da falha como anotação
        if: failure()
        shell: bash
        run: |
          esc() { sed -e "s/%/%25/g" | awk 1 ORS="%0A"; }
          [ -f e2e-output.log ] && echo "::error title=E2E - saída do teste::$(tail -n 60 e2e-output.log | esc)"
          [ -f test-results/e2e-api.log ] && echo "::error title=E2E - log da API::$(tail -n 40 test-results/e2e-api.log | esc)"
          true

      - name: Relatório, traces e log da API (em falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e
          path: |
            playwright-report/
            test-results/
            e2e-output.log
          retention-days: 14
          if-no-files-found: ignore
